<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chromatogram viewer</title>
  </head>
  <body>
    <header>
      <h1>Chromatogram viewer</h1>
      <p class="hint">
        Open an Agilent <code>.ch</code> or <code>.ms</code> file and, optionally, a <code>.prc</code> label file.
        Everything runs in your browser; files are never uploaded.
      </p>
    </header>

    <main>
      <aside id="controls">
        <section>
          <h2>Files</h2>
          <label class="file">Data file (.ch / .ms)
            <input id="data-file" type="file" accept=".ch,.ms,.CH,.MS" />
          </label>
          <label class="file">Label file (.prc, optional)
            <input id="prc-file" type="file" accept=".prc,.PRC" />
          </label>
          <button id="clear-prc" type="button" class="link">Remove labels</button>
          <p class="hint">Or drop files anywhere on the page.</p>
          <div class="examples">
            Examples:
            <button type="button" data-example="fid">FID (.ch + .prc)</button>
            <button type="button" data-example="ms">MS (.ms + .prc)</button>
          </div>
        </section>

        <section>
          <h2>Window</h2>
          <div class="row">
            <label>From (min) <input id="t-start" type="number" step="any" /></label>
            <label>To (min) <input id="t-end" type="number" step="any" /></label>
          </div>
          <button id="reset-window" type="button" class="link">Full run</button>
          <label id="ions-field">Ions (m/z, blank = TIC)
            <input id="ions" type="text" placeholder="e.g. 191 or 191+217" />
          </label>
        </section>

        <section>
          <h2>Display</h2>
          <label>Title <input id="title" type="text" /></label>
          <label class="check"><input id="show-labels" type="checkbox" checked /> Peak labels</label>
          <label class="check"><input id="show-rt" type="checkbox" /> Retention time in labels</label>
          <label class="check"><input id="show-baselines" type="checkbox" /> Peak baselines</label>
          <label class="check"><input id="show-grid" type="checkbox" checked /> Grid</label>
          <div class="row">
            <label>Label size <input id="font-size" type="number" min="6" max="40" step="1" value="11" /></label>
            <label>Line width <input id="line-width" type="number" min="0.2" max="10" step="0.1" value="1" /></label>
          </div>
          <div class="row">
            <label>Width (px) <input id="width" type="number" min="300" max="6000" step="10" value="1200" /></label>
            <label>Height (px) <input id="height" type="number" min="200" max="6000" step="10" value="750" /></label>
          </div>
        </section>

        <div class="export-buttons">
          <button id="export" type="button" class="primary" disabled>Export SVG</button>
          <button id="export-png" type="button" class="primary" disabled>Export PNG</button>
        </div>
      </aside>

      <section id="viewer">
        <div id="messages" role="status"></div>
        <div id="plot" class="empty">No chromatogram loaded.</div>
        <dl id="meta"></dl>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
